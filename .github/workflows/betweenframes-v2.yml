name: Between Frames v2 M0
on:
  pull_request:
    paths:
      - '开发文档/contact-sheet-ai-demo/**'
      - '.github/workflows/betweenframes-v2.yml'
  push:
    paths:
      - '开发文档/contact-sheet-ai-demo/**'
      - '.github/workflows/betweenframes-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: betweenframes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      BETWEEN_FRAMES_OPENAI_API_KEY: ''
      CI: 'true'
    defaults:
      run:
        working-directory: 开发文档/contact-sheet-ai-demo/between-frames
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 开发文档/contact-sheet-ai-demo/between-frames/.node-version
          cache: npm
          cache-dependency-path: 开发文档/contact-sheet-ai-demo/between-frames/package-lock.json
      - name: Rust 已验证工具链
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: 选择 Rust 工具链
        run: echo "RUSTUP_TOOLCHAIN=1.94.0" >> "$GITHUB_ENV"
      - name: 安装锁定依赖与 Chromium
        run: |
          brew install postgresql@15
          echo "/opt/homebrew/opt/postgresql@15/bin" >> "$GITHUB_PATH"
          npm ci
          npx playwright install chromium
      - name: 记录实际工具链
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
      - name: M0 与既有能力回归
        run: npm run verify:v2
      - name: 独立桌面应用构建（不运行）
        run: CARGO_TARGET_DIR=target-v1 npm run tauri -- build --debug --config src-tauri/tauri.v2-review.conf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betweenframes-m0-evidence
          if-no-files-found: warn
          path: |
            开发文档/contact-sheet-ai-demo/between-frames/test-results/
            开发文档/contact-sheet-ai-demo/between-frames/apps/web/dist/
            开发文档/contact-sheet-ai-demo/between-frames/apps/desktop/dist/
