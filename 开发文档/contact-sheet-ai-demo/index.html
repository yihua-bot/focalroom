</style></head><body><div id="app"></div><input type="file" id="file-upload" accept="image/jpeg,image/png,image/webp,image/tiff" multiple hidden><script>
'use strict';
const uid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
const STORAGE_KEY='between-frames-demo-v1'; const DEFAULT_BRIEF='记录那些未被安排的瞬间。不追求单张照片的完美，而关注画面之间的距离、光线与沉默。希望最终形成一组节奏克制、可以反复观看的摄影作品。';
const sampleNames=['某个上午','交错的视线','城市边缘','远处的光','玻璃之后','缓慢时刻','街角练习','不在场','安静的人','黄昏之前','偏离中心','无人应答','近处与远处','空间里的时间','未完成的动作','转身之后','影子的长度','另一次凝视','记忆碎片','经过的人','黑与白','片刻之间','远行','光线的回声','重复的形状','消失的轮廓','陌生的日常','最后一张'];
const sampleReasons=['构图保留了适度留白，让观看者意识到画面之外的空间。','主体虽然不居中，却与背景形成了可以延展的关系。','它并不依靠强烈的瞬间感，但适合成为作品序列的过渡。','这张的光线与其他照片形成呼应，可作为叙事停顿。','它与上一张视觉信息相似，可能需要在两者之间取舍。','色彩相对收敛，符合你提出的克制方向。','这张具有较明确的视觉重心，适合作为段落开端。'];
let state=loadState(); let activeId=state.photos[0]?.id||null; let filter='all', view='grid', rightTab='assistant', modal=null, dragId=null, importBusy=false, toastTimer;
const selectedAI=[1,3,5,7,10,13,16,19,22,25,27];
function defaultState(){return {title:'未命名的日常',brief:DEFAULT_BRIEF,photos:Array.from({length:28},(_,i)=>({id:'sample-'+(i+1),name:sampleNames[i],src:'assets/frame_'+String(i+1).padStart(2,'0')+'.jpg',status:'none',aiSuggested:false,reason:'',note:'',createdAt:'2026-10-12',index:i+1})),order:[],logs:[],aiRuns:0};}
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));return x?.photos?.length?x:defaultState();}catch(e){return defaultState();}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({...state,photos:state.photos.map(x=>({...x,src:x.src?.startsWith('blob:')?'__IDB__':x.src}))}));}catch(e){notify('无法写入浏览器本地存储：请导出备份。')}}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const fmt=n=>String(n).padStart(2,'0');const getPhoto=id=>state.photos.find(p=>p.id===id);const kept=()=>state.order.map(getPhoto).filter(x=>x?.status==='keep');
function logEvent(type,photoId,detail){state.logs.unshift({id:uid(),at:new Date().toISOString(),type,photoId,detail});state.logs=state.logs.slice(0,500);}
function notify(s){let old=document.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3000)}
function updateStatus(id,status,source='human',reason=''){let p=getPhoto(id);if(!p)return;const old=p.status;if(old===status&&source==='human'){status='none'}p.status=status;p.aiSuggested=false;if(status==='keep'&&!state.order.includes(id))state.order.push(id);if(status!=='keep')state.order=state.order.filter(x=>x!==id);if(old!==status)logEvent(source==='ai'?'ai_suggest':'status_change',id,{from:old,to:status,source,reason});save();render()}
function runAI(){if(state.photos.length===0){notify('请先导入图片');return}const suggestions=[];state.photos.forEach((p,i)=>{if(p.status==='none'&&!p.aiSuggested&&(p.id.startsWith('sample-')?selectedAI.includes(p.index):i%3===0))suggestions.push(p)});if(!suggestions.length){notify('目前没有待初选的照片；可以继续人工调整');return}for(const p of suggestions){p.aiSuggested=true;p.reason=sampleReasons[(p.index||0)%sampleReasons.length];logEvent('ai_suggest',p.id,{reason:p.reason})}state.aiRuns++;filter='suggest';save();render();notify('模拟 AI 建议 '+suggestions.length+' 张；请人工选择采纳。未改变已保留作品。')}
function focusPhoto(id){activeId=id;rightTab='assistant';render()}
function showPhotoActions(p){return `<button title="${p.status==='keep'?'撤销保留':'保留'}" aria-label="保留或撤销 ${escapeHTML(p.name)}" class="${p.status==='keep'?'chosen':''}" data-action="keep" data-id="${p.id}">◇</button><button title="${p.status==='reject'?'撤销淘汰':'淘汰'}" aria-label="淘汰或撤销 ${escapeHTML(p.name)}" class="${p.status==='reject'?'chosen':''}" data-action="reject" data-id="${p.id}">×</button>`}
function tileHTML(p){let status=p.status;return `<div class="tile ${p.id===activeId?'focus':''} ${status} ${p.aiSuggested?'suggested':''}" data-id="${p.id}" data-action="focus" role="button" tabindex="0" aria-label="查看第${p.index}张 ${escapeHTML(p.name)}"><div class="photo-wrap"><img loading="lazy" src="${p.src==='__IDB__'?'':escapeHTML(p.src)}" alt="${escapeHTML(p.name)}"><span class="number">${fmt(p.index||1)} / ${escapeHTML(state.title)}</span>${status!=='none'?`<span class="flag ${status}">${status==='keep'?'◇ 已保留':'× 已淘汰'}</span>`:(p.aiSuggested?'<span class="flag" style="color:#e4cea0">✦ AI 建议</span>':'')}</div><div class="tile-under"><span>FRAME ${fmt(p.index||1)}</span><div class="actions">${showPhotoActions(p)}</div></div></div>`}

app.innerHTML=`<div class="app"><aside class="sidebar"><div class="logo"><div class="logo-symbol">B</div><div><div class="brand">BETWEEN</div><div class="brand-sub">FRAMES · STUDIO</div></div></div><div class="group-label">WORKSPACE</div><button class="nav current" data-action="view-grid"><span class="glyph">▦</span> 选片工作台</button><button class="nav" data-action="view-seq"><span class="glyph">▤</span> 作品序列</button><button class="nav" data-action="memory"><span class="glyph">◈</span> 审美记忆</button><div class="side-divider"></div><div class="group-label">CURRENT PROJECT</div><button class="project-link" data-action="edit-project"><strong>${escapeHTML(state.title)}</strong><small>${state.photos.length} 张图像 · ${kept().length} 张入选<br>本地项目 · 可自由编辑</small></button><div class="sidebar-bottom"><span class="dot"></span>仅本地演示 · 无云端上传<br>AI 初选为规则模拟<br>快捷键 K 保留 / X 淘汰</div></aside><section class="main"><header class="top"><div class="eyebrow">PROJECT / 001 — EDITING ROOM</div><div class="heading"><div><h1>${escapeHTML(state.title)}</h1><p>从照片，到作品。&nbsp; / &nbsp;让每一次选择都有来处。</p></div><div class="top-actions"><button class="button" data-action="import">＋ 导入照片</button><button class="button primary" data-action="run-ai">✦ 模拟 AI 初选</button></div></div><div class="brief"><span class="quote">“</span><span class="brief-copy">${escapeHTML(state.brief)}</span><button data-action="edit-project">编辑创作意图 ↗</button></div></header><div class="toolbar"><div class="tabs"><button class="tab ${filter==='all'?'active':''}" data-action="filter" data-value="all">全部 <span class="count">${counts.all}</span></button><button class="tab ${filter==='keep'?'active':''}" data-action="filter" data-value="keep">已保留 <span class="count">${counts.keep}</span></button><button class="tab ${filter==='reject'?'active':''}" data-action="filter" data-value="reject">已淘汰 <span class="count">${counts.reject}</span></button><button class="tab ${filter==='suggest'?'active':''}" data-action="filter" data-value="suggest">✦ AI 建议 一次选择，<br>都是你的表达。</h2><p style="font-size:12px">AI 不应替你决定什么是好照片，而应该理解你为什么选择它。</p><div class="right-tabs"><button data-action="tab-assistant" class="${rightTab==='assistant'?'active':''}">编辑建议</button><button data-action="tab-memory" class="${rightTab==='memory'?'active':''}">审美记忆</button></div>${rightTab==='assistant'?`<div>${p?`<img class="inspector-image" src="${escapeHTML(p.src)}" alt="当前选中：${escapeHTML(p.name)}"><div class="micro">FRAME ${fmt(p.index||1)} / ${p.id.startsWith('sample')?'SAMPLE ROLL':'IMPORTED'}</div><h2 style="font-size:21px;margin:8px 0">${escapeHTML(p.name)}</h2><div class="inspector-buttons"><button class="button ${p.status==='keep'?'primary':''}" data-action="keep" data-id="${p.id}">◇ ${p.status==='keep'?'撤销保留':'保留作品'}</button><button class="button" data-action="reject" data-id="${p.id}">× ${p.status==='reject'?'撤销淘汰':'暂时淘汰'}</button></div><div class="bubble"><small>✦ 编辑意见 · 模拟内容</small>${escapeHTML(p.reason||sampleReasons[(p.index||0)%sampleReasons.length])}<br><span class="note">系统只提供思考方向，摄影师有最终决定权。</span></div><label class="micro" for="reason-input">为什么保留 / 淘汰这张照片？</label><textarea id="reason-input" class="text-input" rows="3" placeholder="写下你的判断，作为长期审美记忆…">${escapeHTML(p.note||'')}</textarea><div style="text-align:right;margin-top:9px"><button class="button tiny" data-action="save-note" data-id="${p.id}">保存我的判断</button></div>`:'<p>先导入一些照片。</p>'}<div class="divider"></div><div class="info-card"><span class="step-tag">PRODUCT PROTOTYPE</span><p style="margin:9px 0 0;font-size:11px">本页 AI 推荐是确定性规则演示，不会调用云端模型，也不会上传您的作品。真实模型方案见开发规格书。</p></div></div>`:`<div class="stat-row"><div class="info-card"><span class="step-tag">YOUR CHOICES</span><div class="big">${state.logs.filter(l=>l.type==='status_change').length}</div><span class="note">人工状态调整</span></div><div class="info-card"><span class="step-tag">AI PROPOSALS</span><div class="big">${state.logs.filter(l=>l.type==='ai_suggest').length}</div><span class="note">模拟初选记录</span></div></div><p class="micro" style="margin-top:23px">偏好记录：系统不把一次淘汰简单理解成永久审美偏好。当前仅记录选择行为和文字解释。</p><div class="divider"></div><div class="right-section-title">RECENT DECISIONS</div>${last.length?last.map(l=>`<div class="timeline-item"><small>${new Date(l.at).toLocaleString('zh-CN')}</small>${l.type==='ai_suggest'?'模拟 AI 建议':l.type==='status_change'?'人工改变选择':l.type==='note'?'记录审美理由':l.type==='compare'?'两图比较偏好':l.type==='reorder'?'修改作品顺序':'操作'} · ${escapeHTML(getPhoto(l.photoId)?.name||'项目')}<div class="note">${escapeHTML(l.detail?.reason||l.detail?.text||'')}</div></div>`).join(''):'<div class="empty">还没有决策记录。从选片开始。</div>'}<div class="divider"></div><button class="button" data-action="export">导出我的审美档案 ↗</button>`}</aside></div>`;
if(modal)renderModal();}
function openModal(kind,data={}){modal={kind,...data};renderModal()}
function renderModal(){document.querySelector('.modal-bg')?.remove();if(!modal)return;let inner='';let m=modal;if(m.kind==='project'){inner=`<div class="modal-head"><div><div class="eyebrow">PROJECT INTENT</div><h2>编辑创作意图</h2></div><button class="modal-close" data-action="close-modal">×</button></div><label for="project-title">项目名称</label><input id="project-title" class="text-input" value="${escapeHTML(state.title)}" maxlength="80"><br><br><label for="project-brief">你希望这组照片表达什么？</label><textarea id="project-brief" rows="6" class="text-input" maxlength="1500">${escapeHTML(state.brief)}</textarea><div style="text-align:right;margin-top:18px"><button class="button primary" data-action="save-project">保存项目描述</button></div>`}
if(m.kind==='export'){inner=`<div class="modal-head"><div><div class="eyebrow">EXPORT THE EDIT</div><h2>导出作品与创作记录</h2></div><button class="modal-close" data-action="close-modal">×</button></div><p style="color:#b4b4ad;line-height:1.8">JSON 包含项目说明、图片元数据、筛选状态、序列与偏好事件，不包含本地原始图片二进制。CSV 是编辑结果索引。</p><div class="flex" style="flex-wrap:wrap"><button class="button primary" data-action="download-json">↓ 项目 JSON</button><button class="button" data-action="download-csv">↓ 选片 CSV</button><button class="button" data-action="print-sheet">⎙ 打印接触印相</button></div><div class="divider"></div><button class="button tiny" data-action="reset">恢复初始演示数据</button><div class="small-muted" style="margin-top:10px">这会清空本地修改和导入图像，请先导出备份。</div>`}
if(m.kind==='compare'){let a=getPhoto(m.a),b=getPhoto(m.b);inner=`<div class="modal-head"><div><div class="eyebrow">PAIRWISE PREFERENCE</div><h2>两张照片，哪一张更适合项目？</h2></div><button class="modal-close" data-action="close-modal">×</button></div><div class="compare-cols">${[a,b].map((p,i)=>`<div><img src="${escapeHTML(p?.src||'')}" alt="${escapeHTML(p?.name||'')}"/><div class="micro" style="margin:11px 0">${i?'RIGHT':'LEFT'} · FRAME ${fmt(p?.index||0)} · ${escapeHTML(p?.name||'')}</div><button class="button ${i?'':'primary'}" data-action="prefer" data-id="${p?.id}" data-other="${i?a?.id:b?.id}">我更喜欢${i?'右':'左'}张 →</button></div>`).join('')}</div><div class="divider"></div><label for="compare-reason">为什么更喜欢它？（可选）</label><textarea id="compare-reason" class="text-input" rows="2" placeholder="例如：它更安静，或者更适合放在这一组照片里。"></textarea><p class="note" style="margin-top:10px">比较偏好会被记录，但不会自动淘汰另一张作品。</p>`}
let bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;bg.addEventListener('click',e=>{if(e.target===bg)closeModal()});document.body.appendChild(bg);}
function closeModal(){modal=null;document.querySelector('.modal-bg')?.remove()}
function download(data,name,type){let blob=new Blob([data],{type});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportJSON(){download(JSON.stringify({...state,exportedAt:new Date().toISOString(),warning:'Image binary data not embedded. Reimport original files when restoring.'},null,2),'between-frames-project.json','application/json')}
function exportCSV(){const rows=[['frame','id','name','status','sequence','reason','user_note'],...state.photos.map(p=>[p.index,p.id,p.name,p.status,state.order.indexOf(p.id)+1||'',p.reason,p.note])];download('\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'between-frames-edit.csv','text/csv;charset=utf-8')}
function printSheet(){let imgs=kept();if(!imgs.length){notify('请先保留至少一张照片');return}let w=window.open('','_blank');if(!w){notify('浏览器拦截了弹窗');return}w.document.write(`<html><head><meta charset="utf-8"><title>${escapeHTML(state.title)} | Contact Sheet</title><style>body{font-family:Georgia,serif;padding:28px;background:#fff;color:#222}h1{font-weight:normal}main{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}img{width:100%;aspect-ratio:1.4;object-fit:cover}small{color:#777}@media print{body{padding:10px}}</style></head><body><h1>${escapeHTML(state.title)}</h1><p>${escapeHTML(state.brief)}</p><main>${imgs.map((p,i)=>`<div><img src="${escapeHTML(p.src)}"><small>${fmt(i+1)} / ${escapeHTML(p.name)}</small></div>`).join('')}</main></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),450)}
function showCompare(){if(state.photos.length<2){notify('至少需要两张照片');return}let first=getPhoto(activeId)||state.photos[0];let arr=filter==='keep'?kept():state.photos;let index=arr.findIndex(p=>p.id===first.id);if(index<0)index=0;let b=arr[(index+1)%arr.length];if(!b||b.id===first.id){b=state.photos.find(p=>p.id!==first.id)}openModal('compare',{a:first.id,b:b.id})}
async function reset(){if(!confirm('确定清空本地项目修改及已导入的演示图片？此操作不可撤销。'))return;state=defaultState();activeId=state.photos[0].id;filter='all';view='grid';rightTab='assistant';localStorage.removeItem(STORAGE_KEY);try{let d=await openDB();let t=d.transaction('images','readwrite');t.objectStore('images').clear()}catch{}closeModal();render();notify('已恢复初始演示数据')}
function openDB(){return new Promise((resolve,reject)=>{if(!indexedDB){reject(new Error('unsupported'));return}const r=indexedDB.open('between-frames-images',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('images'))r.result.createObjectStore('images',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function importFiles(files){if(importBusy)return;const arr=[...files].filter(f=>/^image\/(jpeg|png|webp|tiff)$/.test(f.type));if(!arr.length){notify('请选择 JPEG / PNG / WebP / TIFF 图片');return}if(arr.length>100){notify('单次最多导入 100 张');return}importBusy=true;let db;try{db=await openDB()}catch(e){notify('无法使用 IndexedDB，无法持久化导入照片');importBusy=false;return}let done=0;for(const file of arr){if(file.size>25*1024*1024){notify('跳过超过 25 MB 的图片：'+file.name);continue}const id='user-'+uid();await new Promise((resolve,reject)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put({id,blob:file});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});state.photos.push({id,name:file.name.replace(/\.[^.]+$/,''),src:URL.createObjectURL(file),status:'none',aiSuggested:false,reason:'',note:'',index:state.photos.length+1,createdAt:new Date().toISOString()});done++}db.close();save();importBusy=false;filter='all';view='grid';render();notify('已导入 '+done+' 张照片，保存在当前浏览器的 IndexedDB 中')}
async function restoreImages(){try{let db=await openDB();let pending=state.photos.filter(p=>p.src==='__IDB__');await Promise.all(pending.map(p=>new Promise(resolve=>{let r=db.transaction('images').objectStore('images').get(p.id);r.onsuccess=()=>{if(r.result?.blob)p.src=URL.createObjectURL(r.result.blob);else p.src='';resolve()};r.onerror=resolve})));db.close();render()}catch(e){console.warn('restore',e)}}
async function act(action,id,value,e){if(action==='focus'){focusPhoto(id);return}if(action==='keep'||action==='reject'){updateStatus(id,action);return}if(action==='run-ai'){runAI();return}if(action==='accept-suggestions'){const picks=state.photos.filter(p=>p.aiSuggested&&p.status==='none');if(!picks.length){notify('没有待采纳的建议');return}for(const p of picks){p.status='keep';p.aiSuggested=false;if(!state.order.includes(p.id))state.order.push(p.id);logEvent('status_change',p.id,{from:'none',to:'keep',source:'user_accept_ai',reason:p.reason})}filter='keep';save();render();notify('已采纳 '+picks.length+' 条建议；这些是你的最终决定。');return}if(action==='filter'){filter=value;view='grid';render();return}if(action==='view-grid'){view='grid';render();return}if(action==='view-seq'){view='sequence';render();return}if(action==='memory'||action==='tab-memory'){rightTab='memory';render();return}if(action==='tab-assistant'){rightTab='assistant';render();return}if(action==='compare'){showCompare();return}if(action==='edit-project'){openModal('project');return}if(action==='import'){document.getElementById('file-upload').click();return}if(action==='export'){openModal('export');return}if(action==='close-modal'){closeModal();return}if(action==='save-project'){state.title=document.getElementById('project-title').value.trim()||'未命名项目';state.brief=document.getElementById('project-brief').value.trim()||DEFAULT_BRIEF;logEvent('project_update',null,{});save();closeModal();render();notify('项目已保存');return}if(action==='save-note'){let p=getPhoto(id);let val=document.getElementById('reason-input').value.trim();if(p&&p.note!==val){p.note=val;logEvent('note',id,{text:val});save();notify('已记录你的审美判断')}return}if(action==='download-json'){exportJSON();return}if(action==='download-csv'){exportCSV();return}if(action==='print-sheet'){printSheet();return}if(action==='reset'){await reset();return}if(action==='prefer'){const reason=document.getElementById('compare-reason')?.value.trim()||'';const preferred=getPhoto(id);logEvent('compare',id,{otherId:value,reason});if(preferred.status!=='keep'){preferred.status='keep';if(!state.order.includes(id))state.order.push(id)}save();closeModal();render();notify('已记录两图偏好，保留你选择的照片');return}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;e.preventDefault();e.stopPropagation();act(btn.dataset.action,btn.dataset.id,btn.dataset.value||btn.dataset.other,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal();return}if(modal||['TEXTAREA','INPUT'].includes(document.activeElement?.tagName))return;const arr=filter==='keep'?kept():filter==='suggest'?state.photos.filter(p=>p.aiSuggested):filter==='reject'?state.photos.filter(p=>p.status==='reject'):state.photos;let i=arr.findIndex(p=>p.id===activeId);if(e.key.toLowerCase()==='k'){e.preventDefault();updateStatus(activeId,'keep')}if(e.key.toLowerCase()==='x'){e.preventDefault();updateStatus(activeId,'reject')}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();activeId=arr[Math.max(0,Math.min(arr.length-1,i+(e.key==='ArrowRight'?1:-1)))]?.id||activeId;render()}if(e.key.toLowerCase()==='c'){showCompare()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag-id]');if(c){dragId=c.dataset.dragId;e.dataTransfer.effectAllowed='move';c.classList.add('dragging')}});
document.addEventListener('dragend',e=>{dragId=null;document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'))});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-drag-id]');if(c&&dragId){e.preventDefault();c.classList.add('drop-target')}});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-drag-id]');if(!c||!dragId||dragId===c.dataset.dragId)return;e.preventDefault();let a=state.order.indexOf(dragId),b=state.order.indexOf(c.dataset.dragId);if(a<0||b<0)return;state.order.splice(a,1);state.order.splice(b,0,dragId);logEvent('reorder',dragId,{to:b+1});save();render();notify('已保存新的作品顺序')});
document.getElementById('file-upload').addEventListener('change',async e=>{await importFiles(e.target.files);e.target.value=''});
render();restoreImages();
</script></body></html>
