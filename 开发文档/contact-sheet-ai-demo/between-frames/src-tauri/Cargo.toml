[package]
name = "between-frames"
version = "1.4.9"
description = "序间：本地优先的摄影编辑工作台"
authors = ["Between Frames"]
edition = "2024"
default-run = "between-frames"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "between_frames_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri-plugin-deep-link = { version = "2", optional = true }
betweenframes-local-domain = { path = "../crates/local-domain" }
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "io-std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
flate2 = "1"
sha2 = "0.10"
hmac = "0.12"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-updater = { version = "2.14.0", optional = true }
tauri-plugin-process = { version = "2.4.0", optional = true }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
native-agent = []
integration-harness = []

[[bin]]
name = "between-frames"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "m1-harness"
path = "src/bin/m1-harness.rs"
required-features = ["integration-harness"]

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = false

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"], optional = true }
security-framework = "3.7"
core-foundation = "0.10"
core-graphics = "0.24"
foreign-types = "0.5"
