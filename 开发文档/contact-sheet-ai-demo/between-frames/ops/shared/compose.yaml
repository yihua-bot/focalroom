# 独立项目栈；不引用或修改 openyc 的容器、数据库与网络。
name: focalroom-shared-review
services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: focalroom
      POSTGRES_PASSWORD: ${FOCALROOM_DB_PASSWORD:?set an isolated database password}
      POSTGRES_DB: focalroom
      # 首次初始化由 01-create-roles.sh 创建最小权限角色（密码不落仓库）。
      FOCALROOM_APP_PASSWORD: ${FOCALROOM_APP_PASSWORD:?set the app role password}
      FOCALROOM_MIGRATOR_PASSWORD: ${FOCALROOM_MIGRATOR_PASSWORD:?set the migrator role password}
    volumes:
      [pg-data:/var/lib/postgresql/data, ./postgres-init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U focalroom -d focalroom"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: { context: ../.., dockerfile: ops/shared/Dockerfile.api }
    environment:
      # 运行时使用最小权限应用角色（仅 DML）；迁移命令另用迁移角色（DDL）。
      FOCALROOM_DATABASE_URL: postgresql://focalroom_app:${FOCALROOM_APP_PASSWORD}@postgres:5432/focalroom
      FOCALROOM_MIGRATOR_DATABASE_URL: postgresql://focalroom_migrator:${FOCALROOM_MIGRATOR_PASSWORD}@postgres:5432/focalroom
      FOCALROOM_WEB_ORIGIN: ${FOCALROOM_WEB_ORIGIN:-http://127.0.0.1:8084}
      FOCALROOM_PREVIEW_DIRECTORY: /data/previews
      FOCALROOM_RESEND_API_KEY: ${FOCALROOM_RESEND_API_KEY:-}
      FOCALROOM_EMAIL_FROM: ${FOCALROOM_EMAIL_FROM:-FocalRoom <noreply@focalroom.app>}
      # Google 登录：与前端 VITE_FOCALROOM_GOOGLE_CLIENT_ID 同值；留空则 /auth/google 返回 501。
      FOCALROOM_GOOGLE_CLIENT_ID: ${FOCALROOM_GOOGLE_CLIENT_ID:-}
      # 官方 AI 密钥仅进入 API 容器；默认赠额为 0，运营明确分配后才可调用。
      FOCALROOM_DEEPSEEK_API_KEY: ${FOCALROOM_DEEPSEEK_API_KEY:-}
      FOCALROOM_AI_INITIAL_TOKENS: ${FOCALROOM_AI_INITIAL_TOKENS:-0}
      # 订阅默认关闭；支付密钥仅进入 API，不打包到客户端或 Web。
      FOCALROOM_BILLING_ENABLED: ${FOCALROOM_BILLING_ENABLED:-0}
      FOCALROOM_STRIPE_SECRET_KEY: ${FOCALROOM_STRIPE_SECRET_KEY:-}
      FOCALROOM_STRIPE_WEBHOOK_SECRET: ${FOCALROOM_STRIPE_WEBHOOK_SECRET:-}
      FOCALROOM_BILLING_PRICES: ${FOCALROOM_BILLING_PRICES:-[]}
    volumes: [preview-data:/data/previews]
    depends_on:
      postgres: { condition: service_healthy }
  agent-worker:
    # M4 云 Agent Worker：领取授权队列任务，只读评论汇总；模型 Key 经环境注入。
    build: { context: ../.., dockerfile: ops/shared/Dockerfile.api }
    command: ["node", "workers/agent/src/main.ts"]
    environment:
      FOCALROOM_DATABASE_URL: postgresql://focalroom_app:${FOCALROOM_APP_PASSWORD}@postgres:5432/focalroom
      FOCALROOM_AGENT_MODEL_KEY: ${FOCALROOM_AGENT_MODEL_KEY:-}
      FOCALROOM_AGENT_MODEL_BASE_URL: ${FOCALROOM_AGENT_MODEL_BASE_URL:-}
      FOCALROOM_AGENT_MODEL_NAME: ${FOCALROOM_AGENT_MODEL_NAME:-}
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: { context: ../.., dockerfile: ops/shared/Dockerfile.web }
    ports: ["127.0.0.1:8084:80"]
    depends_on: [api]
volumes:
  pg-data: {}
  preview-data: {}
