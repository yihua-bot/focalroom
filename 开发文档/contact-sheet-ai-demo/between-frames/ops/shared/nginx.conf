map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 16m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data: https://lh3.googleusercontent.com https://lh4.googleusercontent.com https://lh5.googleusercontent.com https://lh6.googleusercontent.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/v2/ {
    access_log off;
    proxy_pass http://api:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 115s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
